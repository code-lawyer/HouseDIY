name: Checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        if: runner.os != 'Windows'
      - run: npm ci
        if: runner.os == 'Windows'
      - run: npm run check
      - run: npm test
      - name: Verify the Windows editor
        if: runner.os == 'Windows'
        run: npm run test:ui
      - name: Verify design checks and recovery
        if: runner.os == 'Windows'
        run: npm run test:first-fixes
      - name: Verify custom model persistence
        if: runner.os == 'Windows'
        run: npm run test:models
      - name: Build the Windows portable application
        if: runner.os == 'Windows'
        run: npm run build
      - name: Open and exercise the packaged application
        if: runner.os == 'Windows'
        env:
          HOUSEDIY_PLAN_FIXTURE: examples/demo-plan.json
        run: npm run test:package
