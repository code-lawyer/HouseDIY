name: Checks

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        if: runner.os != 'Windows'
      - run: npm ci
        if: runner.os == 'Windows'
      - run: npm run check
      - run: npm test
      - name: Verify the Windows editor
        if: runner.os == 'Windows'
        run: npm run test:ui
      - name: Verify design checks and recovery
        if: runner.os == 'Windows'
        run: npm run test:first-fixes
      - name: Verify custom model persistence
        if: runner.os == 'Windows'
        run: npm run test:models
      - name: Build the Windows portable application
        if: runner.os == 'Windows'
        run: npm run build
      - name: Open and exercise the packaged application
        if: runner.os == 'Windows'
        env:
          HOUSEDIY_PLAN_FIXTURE: examples/demo-plan.json
        run: npm run test:package
      - name: Bind the tested executable to the source commit
        id: release-proof
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $asset = "HouseDIY-$version-portable.exe"
          $proof = Get-Content -Raw .qa/packaged/results.json | ConvertFrom-Json
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match package.json"
          }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath "release/$asset").Hash.ToLowerInvariant()
          if (
            $proof.sha256 -ne $sha -or $proof.executable -ne $asset -or
            $proof.sourceCommit -ne $env:GITHUB_SHA -or $proof.version -ne $version -or
            $proof.error -or $proof.skipped.Count -gt 0 -or $proof.errors.Count -gt 0 -or
            $proof.networkErrors.Count -gt 0 -or $proof.checks.Count -eq 0
          ) {
            throw "The release file does not match the verified executable"
          }
          Set-Content -Encoding ascii -LiteralPath "release/HouseDIY-$version-portable.sha256" -Value "$sha  $asset"
          Copy-Item -LiteralPath .qa/packaged/results.json -Destination "release/HouseDIY-$version-test-results.json"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload the verified Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HouseDIY-windows-x64-${{ github.sha }}
          path: |
            release/HouseDIY-${{ steps.release-proof.outputs.version }}-portable.exe
            release/HouseDIY-${{ steps.release-proof.outputs.version }}-portable.sha256
            release/HouseDIY-${{ steps.release-proof.outputs.version }}-test-results.json
          if-no-files-found: error
          compression-level: 0
